<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1012">
    <title>Kanso</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/shell.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/invoices.css">
    <link rel="stylesheet" href="css/missing.css">
    <link rel="stylesheet" href="css/files.css">
    <link rel="stylesheet" href="css/analytics.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app">
        <aside class="rail">
            <nav class="nav">
                <a href="#calendar" data-view="calendar" data-i18n-label="nav.calendar"><span data-icon="calendar"></span><span class="tip" data-i18n="nav.calendar"></span></a>
                <a href="#analytics" data-view="analytics" data-i18n-label="nav.analytics"><span data-icon="chart"></span><span class="tip" data-i18n="nav.analytics"></span></a>
                <a href="#invoices" data-view="invoices" data-i18n-label="nav.invoices"><span data-icon="receipt"></span><span class="tip" data-i18n="nav.invoices"></span></a>
                <a href="#missing" data-view="missing" data-i18n-label="nav.missing"><span data-icon="alert"></span><span class="tip" data-i18n="nav.missing"></span><span class="badge" id="n-missing"></span></a>
                <a href="#files" data-view="files" data-i18n-label="nav.files" id="nav-files"><span data-icon="folder"></span><span class="tip" data-i18n="nav.files"></span></a>
            </nav>
            <nav class="nav nav-end">
                <a href="#settings" data-view="settings" data-i18n-label="nav.settings"><span data-icon="settings"></span><span class="tip" data-i18n="nav.settings"></span></a>
            </nav>
        </aside>
        <main class="main" id="main">
            <div class="loading" data-i18n="nav.loading"></div>
        </main>
    </div>
    <div class="demo-bar" id="demo-bar" hidden><span data-i18n="demo.bar"></span><button class="btn sm" data-action="demo-off" data-i18n="demo.quit"></button></div>
    <div class="modal" id="modal" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <script src="js/main.js" type="module"></script>
</body>
</html>
