<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1012">
    <title>Kanso</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="app">
        <aside class="rail">
            <a href="#calendar" title="Kanso"><img class="mark" src="icon.svg" alt=""></a>
            <nav class="nav">
                <a href="#calendar" data-view="calendar" aria-label="Calendrier"><span data-icon="calendar"></span><span class="tip">Calendrier</span></a>
                <a href="#analytics" data-view="analytics" aria-label="Analyse"><span data-icon="chart"></span><span class="tip">Analyse</span></a>
                <a href="#invoices" data-view="invoices" aria-label="Factures"><span data-icon="receipt"></span><span class="tip">Factures</span></a>
                <a href="#missing" data-view="missing" aria-label="À récupérer"><span data-icon="alert"></span><span class="tip">À récupérer</span><span class="badge" id="n-missing"></span></a>
                <a href="#files" data-view="files" aria-label="Dossier Inc"><span data-icon="folder"></span><span class="tip">Dossier Inc</span></a>
            </nav>
            <div class="rail-foot" id="sync" title="Synchronisé avec le dossier Inc">
                <span class="sync-dot" id="sync-dot"></span>
            </div>
        </aside>
        <main class="main" id="main">
            <div class="loading">Lecture du dossier…</div>
        </main>
    </div>
    <div class="modal" id="modal" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <script src="js/main.js" type="module"></script>
</body>
</html>
